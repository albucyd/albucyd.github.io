<figure class="image">
  {% if image.full_url != '' %}
  <a href="{{ include.full_url }}" target="_blank"><img src="{{ include.url }}" alt="{{ include.alt }}"></a>
  {% else %}
  <img src="{{ include.url }}" alt="{{ include.alt }}">
  {% endif %}
  {% if image.description != '' %}<figcaption>{{ include.description }}</figcaption>{% endif %}
</figure>
